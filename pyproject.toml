[project]
name = "veridex"
version = "0.1.0"
description = "Brute-force solver for Knights & Knaves logic puzzles"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
veridex-demo = "veridex.demo:main"
veridex-play = "veridex.play:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veridex"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
